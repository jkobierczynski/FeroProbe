name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      # The hardened build (ICS protection compiled in) must build and pass too.
      - run: cargo test -p feroprobe --features ics-protection-default
      # Every feroprobe-diff feature end to end (bash and python3, no root).
      - name: feroprobe-diff test script
        if: runner.os != 'Windows'
        run: ./scripts/test-feroprobe-diff.sh -v

  # The SYN scan and ICMP discovery need raw sockets, so run the whole test
  # suite again as root on Linux. FEROPROBE_REQUIRE_RAW makes the raw-socket
  # tests fail instead of skipping if privileges are somehow missing, and
  # FEROPROBE_REQUIRE_IPV6 does the same for the IPv6 loopback tests.
  raw-sockets:
    name: ubuntu-latest (root, raw sockets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
          FEROPROBE_REQUIRE_RAW: "1"
          FEROPROBE_REQUIRE_IPV6: "1"
