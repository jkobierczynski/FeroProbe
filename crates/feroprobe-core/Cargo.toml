[package]
name = "feroprobe-core"
description = "Scanning engine for FeroProbe, a native Rust network scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures = "0.3.34"
ipnet = "2.12.2"
serde = { version = "1.0.229", features = ["derive"] }
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "time", "rt-multi-thread", "macros", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
