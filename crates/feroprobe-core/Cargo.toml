[package]
name = "feroprobe-core"
description = "Scanning engine for FeroProbe, a native Rust network scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
futures = "0.3.34"
ipnet = "2.12.2"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "time", "rt-multi-thread", "macros", "sync", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "async_tokio"] }
rcgen = "0.14.10"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }

[[bench]]
name = "core"
harness = false
