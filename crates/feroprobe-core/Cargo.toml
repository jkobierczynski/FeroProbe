[package]
name = "feroprobe-core"
description = "Scanning engine for FeroProbe, a native Rust network scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
dns-lookup = "4.0.2"
futures = "0.3.34"
ipnet = "2.12.2"
# The script engine: Lua 5.4 built in (MIT), run on the scan's tokio runtime.
mlua = { version = "0.12.2", features = ["lua54", "vendored", "async", "send"] }
# Big numbers for the NSE layer's openssl.bignum_* (MIT or Apache-2.0;
# already used by x509-parser).
num-bigint = "0.4.8"
num-traits = "0.2.19"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl"] }
# Certificate fingerprints (SHA-1, SHA-256) for scripts; already used by rustls.
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "time", "rt-multi-thread", "macros", "sync", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
# Certificate fields for the scripts' TLS library (MIT or Apache-2.0).
x509-parser = "0.18.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "async_tokio"] }
rcgen = "0.14.10"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }

[[bench]]
name = "core"
harness = false
